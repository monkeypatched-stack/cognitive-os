# One shared Gazebo Transport server for the three standalone PX4 pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: house-alpha-model
  namespace: monkeybrain
  labels:
    app: gazebo-shared
data:
  # SIMULATOR-ONLY crash-test demo target (kernel/domains/robot.py::
  # CrashTestCapability, deploy/gazebo/models/house_alpha/model.sdf --
  # kept identical to that repo file; update both together). Mounted
  # read-only into the world-setup container below and spawned once into
  # the already-running shared world via `gz service .../create`.
  model.sdf: |
    <?xml version="1.0"?>
    <sdf version="1.9">
      <model name="house_alpha">
        <!-- Static: no physics/gravity interaction beyond being a solid,
             collidable box -- this is a target structure for the crash-test
             demo, not a simulated building with interior physics. -->
        <static>true</static>
        <link name="body">
          <!-- Origin at ground level; box extends upward. A simple gable-less
               box is deliberately visually distinct (flat red walls, white
               roof slab) so LoFTR has real texture/geometry to match a
               reference photo against, not a featureless cube. -->
          <collision name="collision">
            <geometry>
              <box>
                <size>6 5 3</size>
              </box>
            </geometry>
          </collision>
          <visual name="walls">
            <pose>0 0 1.5 0 0 0</pose>
            <geometry>
              <box>
                <size>6 5 3</size>
              </box>
            </geometry>
            <material>
              <ambient>0.65 0.15 0.1 1</ambient>
              <diffuse>0.65 0.15 0.1 1</diffuse>
            </material>
          </visual>
          <visual name="roof">
            <pose>0 0 3.15 0 0 0</pose>
            <geometry>
              <box>
                <size>6.4 5.4 0.3</size>
              </box>
            </geometry>
            <material>
              <ambient>0.9 0.9 0.88 1</ambient>
              <diffuse>0.9 0.9 0.88 1</diffuse>
            </material>
          </visual>
        </link>
      </model>
    </sdf>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gazebo-shared
  namespace: monkeybrain
  labels:
    app: gazebo-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gazebo-shared
  template:
    metadata:
      labels:
        app: gazebo-shared
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: house-alpha-model
          configMap:
            name: house-alpha-model
      containers:
        - name: gazebo
          image: px4-sitl-flat:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GZ_PARTITION
              value: "cognitiveos-shared"
          command: ["/usr/bin/gz"]
          args: ["sim", "--verbose=1", "-r", "-s", "/opt/px4-gazebo/share/gz/worlds/default.sdf"]
          ports:
            - name: discovery
              containerPort: 10317
              protocol: UDP
            - name: transport
              containerPort: 11345
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "gz topic -l | grep -q '^/world/default/clock$'"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

        - name: world-setup
          # SIMULATOR-ONLY crash-test demo support (kernel/domains/
          # robot.py::CrashTestCapability, deploy/gazebo/models/
          # house_alpha/). Spawns one static structure into the ALREADY
          # RUNNING shared world via `gz service .../create` (never edits
          # the base default.sdf, which is baked into the px4-sitl-flat
          # image, not a repo file) -- same "wait for the real readiness
          # condition, then run one command" shape as px4-sim-deployment
          # .yaml's own camera-bridge container. Coordinates (x=15, y=0,
          # z=0, Gazebo world/ENU frame) match CRASH_TEST_TARGETS'
          # documented default for "house_alpha" in .env.example -- update
          # both together if either changes.
          #
          # BEST-EFFORT / NOT LIVE-VERIFIED: written without access to a
          # running cluster to confirm exact `gz service` request-field
          # names/behavior against this image's actual gz version. Verify
          # live (`kubectl logs -f deploy/gazebo-shared -c world-setup`)
          # before relying on this for a demo.
          image: px4-sitl-flat:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GZ_PARTITION
              value: "cognitiveos-shared"
          command: ["bash", "-lc"]
          args:
            - |
              echo "world-setup: waiting for /world/default/clock..."
              until gz topic -l 2>/dev/null | grep -q '^/world/default/clock$'; do sleep 2; done
              echo "world-setup: spawning house_alpha..."
              gz service -s /world/default/create \
                --reqtype gz.msgs.EntityFactory --reptype gz.msgs.Boolean --timeout 5000 \
                --req 'sdf_filename: "/models/house_alpha/model.sdf", name: "house_alpha", pose: {position: {x: 15, y: 0, z: 0}}'
              echo "world-setup: done"
              sleep infinity
          volumeMounts:
            - name: house-alpha-model
              mountPath: /models/house_alpha
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gazebo-shared
  namespace: monkeybrain
  labels:
    app: gazebo-shared
spec:
  selector:
    app: gazebo-shared
  ports:
    - name: discovery
      port: 10317
      targetPort: 10317
      protocol: UDP
    - name: transport
      port: 11345
      targetPort: 11345
      protocol: TCP
