# CognitiveOS Ground Actor — a robot-class Actor Cell, the ground-vehicle
# analog of deploy/k8s/drone-actor-deployment.yaml. Same TEMPLATE precedent
# as actor-deployment.yaml (render once PER ground-robot actor_id via
# envsubst, apply directly -- not part of kustomization.yaml's static base).
#
# The Nav2 simulator (Gazebo + TurtleBot3 + Nav2 bringup) and the ROS 2/
# rclpy bridge to it (ros-bridge) live in a SEPARATE Pod/Deployment
# (deploy/k8s/nav2-sim-deployment.yaml, same ACTOR_ID) -- this Pod contains
# ONLY the CognitiveOS actor itself, the plain, unmodified
# monkeybrain/agentos:latest image every non-robot actor already uses (no
# ROS 2 baked in at all). It reaches the ROS bridge over plain HTTP via
# that Deployment's own Service (kernel/edge/ros_integration.py::
# RemoteRosExecutionAdapter, unchanged -- already vehicle-agnostic,
# ROS_ADAPTER_KIND=remote_http below) -- same "avoids cross-Pod ROS 2 DDS
# discovery entirely" reasoning drone-actor-deployment.yaml's own header
# gives.
#
#   ACTOR_ID=ground-a ACTOR_ARTIFACT_VERSION=1.0.0 \
#     envsubst '${ACTOR_ID} ${ACTOR_ARTIFACT_VERSION}' \
#     < deploy/k8s/ground-actor-deployment.yaml | kubectl apply -f -
#
# Must be applied for the SAME ACTOR_ID as a nav2-sim-deployment.yaml
# rendering (ROS_BRIDGE_URL below points at that Deployment's Service by
# name) -- this Pod alone cannot drive anything. Pick an ACTOR_ID distinct
# from any drone actor's (e.g. "ground-a", not "drone-a") -- see
# nav2-sim-deployment.yaml's own header for why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitiveos-actor-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: cognitiveos-actor
    component: ground-actor-runtime
    actor-id: "${ACTOR_ID}"
    node-class: "robot"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cognitiveos-actor
      actor-id: "${ACTOR_ID}"
  template:
    metadata:
      labels:
        app: cognitiveos-actor
        actor-id: "${ACTOR_ID}"
        node-class: "robot"
    spec:
      serviceAccountName: cognitiveos-actor-provisioner
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for target in redis:6379 mongodb:27017 nats:4222; do
                host="${target%%:*}"; port="${target##*:}"
                until nc -z -w2 "$host" "$port"; do
                  echo "waiting for $target..."
                  sleep 2
                done
                echo "$target is up"
              done
      containers:
        - name: cognitiveos-actor
          # Back on the plain image (no ROS 2 baked in) -- ROS execution
          # happens in the separate nav2-sim-${ACTOR_ID} Pod's ros-bridge
          # container, reached over HTTP (ROS_ADAPTER_KIND=remote_http
          # below), so this container never imports rclpy at all.
          image: monkeybrain/agentos:latest
          imagePullPolicy: IfNotPresent
          # docker/Dockerfile.base's own default CMD runs the CLOUD
          # control-plane app -- same override drone-actor-deployment.yaml
          # already uses for this exact image.
          command:
            - python
            - -m
            - uvicorn
            - src.monkey_brain.actor_runtime:app
            - --host
            - "0.0.0.0"
            - --port
            - "8051"
          ports:
            - containerPort: 8051
              name: http
          envFrom:
            - configMapRef:
                name: agentos-config
          env:
            - name: ACTOR_ID
              value: "${ACTOR_ID}"
            - name: ACTOR_NODE_CLASS
              value: "robot"
            # Narrows this actor's own planner prompt to Nav2-only
            # capability names (kernel/pipeline/planning/context_engine.py
            # _retrieve_available_capabilities) -- without this, a
            # ground-robot planner also sees the PX4 drone's Arm/Takeoff/
            # Waypoint/Land names as "available" and can hallucinate one
            # onto an otherwise-correct NavigateToPose plan.
            - name: ROBOT_VEHICLE_KIND
              value: "nav2"
            - name: ACTOR_NODE_CAPACITY
              value: "1"
            - name: ACTOR_CLAIM_PLACEMENT
              value: "true"
            # First-time bring-up of this actor (see actor_runtime.py's own
            # doc comment) -- ground-a has no existing Actor Registry
            # record yet. Dev/test convenience, not for a real deployment
            # re-registering an already-placed actor.
            - name: ACTOR_BOOTSTRAP_IF_MISSING
              value: "true"
            - name: ACTOR_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # See drone-actor-deployment.yaml's identical env var comment --
            # a stable, deterministic node identity across restarts.
            - name: COGNITIVEOS_NODE_ID
              value: "cognitiveos-actor-${ACTOR_ID}"
            - name: ACTOR_ARTIFACT_VERSION
              value: "${ACTOR_ARTIFACT_VERSION}"
            # Real Nav2 adapter selection (kernel/edge/ros_integration.py
            # build_ros_execution_adapter) -- remote_http delegates
            # invoke() over HTTP to the separate nav2-sim-${ACTOR_ID} Pod's
            # ros-bridge container instead of importing rclpy in-process.
            # ROS_BRIDGE_URL must match nav2-sim-deployment.yaml's Service
            # name for the SAME ACTOR_ID.
            - name: ROS_ADAPTER_KIND
              value: "remote_http"
            - name: ROS_REQUIRE_REAL
              value: "true"
            - name: ROS_BRIDGE_URL
              value: "http://nav2-sim-${ACTOR_ID}.monkeybrain.svc.cluster.local:${ROS_BRIDGE_PORT}"
            # See drone-actor-deployment.yaml's identical env var comment --
            # a containerized Ollama sidecar failed repeatedly in this
            # environment. Points at this host's own native Ollama.
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            - name: LLAMACPP_BASE_URL
              value: "http://127.0.0.1:8080"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: neo4j-password
            - name: MOSS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: moss-project-id
            - name: MOSS_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: moss-project-key
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: internal-service-token
          volumeMounts:
            # File-type hostPath bind-mounted onto the exact file path, NOT
            # onto the /models directory -- confirmed live that mounting a
            # file-type hostPath at mountPath: /models makes /models ITSELF
            # become the file (matching the source), not a directory
            # containing it, so llama-server's own --model /models/model.gguf
            # failed with "failed to open GGUF file ... (Not a directory)".
            - name: actor-llm-model
              mountPath: /models/model.gguf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /live
              port: 8051
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            # See drone-actor-deployment.yaml's identical probe comment --
            # a real multi-step mission (NavigateToPose can legitimately
            # run to Nav2's own ~120s default timeout) needs the same
            # generous tolerance a real PX4 mission needed, for the same
            # reason: a legitimately-still-running action must never look
            # like a hung Pod to the liveness probe.
            failureThreshold: 16
          readinessProbe:
            httpGet:
              path: /ready
              port: 8051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /live
              port: 8051
            periodSeconds: 5
            failureThreshold: 20
            timeoutSeconds: 5
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server
          imagePullPolicy: IfNotPresent
          command: ["/app/llama-server"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--model"
            - "/models/model.gguf"
            # 4096 (drone-actor-deployment.yaml's own default) was too
            # small -- confirmed live: this actor's real planner prompt
            # (capability list + world facts + goal) is 4820 tokens,
            # llama-server rejected it outright ("exceeds the available
            # context size"), and planning silently produced an empty
            # plan rather than a real capability call. gemma-3-4b-it
            # supports up to 128K context; 8192 is a modest bump with
            # real headroom, not the model's actual ceiling.
            - "--ctx-size"
            - "8192"
            # Confirmed live via this container's own startup log
            # ("n_threads = 10"): llama-server defaults to one thread per
            # host CPU, ignoring this container's own 2000m CPU limit
            # below -- 10 threads contending for a 2-core cgroup quota is
            # pure context-switch overhead, and (observed) starves
            # concurrently-running pods (nav2-sim's real-time control
            # loop) of scheduling latency even though llama-cpp's own
            # cgroup CPU quota is what actually caps its throughput.
            # Matching --threads to the CPU limit removes that overhead
            # without changing llama-cpp's own throughput ceiling.
            - "--threads"
            - "2"
          ports:
            - containerPort: 8080
              name: llama-cpp
          volumeMounts:
            # See the cognitiveos-actor container's own volumeMounts
            # comment above -- same file-hostPath-onto-exact-path fix.
            - name: actor-llm-model
              mountPath: /models/model.gguf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
      volumes:
        - name: actor-llm-model
          hostPath:
            path: /var/lib/cognitiveos/models/${LLAMACPP_MODEL_FILE}
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: cognitiveos-actor-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: cognitiveos-actor
    actor-id: "${ACTOR_ID}"
spec:
  selector:
    app: cognitiveos-actor
    actor-id: "${ACTOR_ID}"
  ports:
    - port: 8051
      targetPort: 8051
      protocol: TCP
      name: http
  type: ClusterIP
