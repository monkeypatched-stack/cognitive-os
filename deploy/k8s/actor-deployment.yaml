# CognitiveOS Actor — deployment template for ONE Actor's independently-
# deployable runtime (src/monkey_brain/actor_runtime.py), the Actor
# Artifact model (docs/ACTOR_ARTIFACT.md).
#
# Same substrate precedent edge-actor-deployment.yaml already established:
# no separate image/build target — this uses the SAME monkeybrain/agentos
# image as deployment.yaml, differing only in the container `command:`
# (Section 12: "Do not require a different Actor implementation for
# Docker. The Docker image should simply package the Actor binary.").
# Unlike edge-actor-deployment.yaml (which boots the old, disconnected
# EdgeActor prototype), this boots the REAL, governed CognitiveActor via
# PlanetaryRuntime — the same cognition, capabilities, and
# TransitionGate-enforced authority the cloud deployment uses, just
# possibly placed on an edge/device/robot node.
#
# This is a TEMPLATE — render it once PER ACTOR:
#
#   ACTOR_ID=alice ACTOR_NODE_CLASS=edge \
#     envsubst '${ACTOR_ID} ${ACTOR_NODE_CLASS}' \
#     < deploy/k8s/actor-deployment.yaml | kubectl apply -f -
#
# `replicas: 1`, same reasoning as edge-actor-deployment.yaml: this is a
# genuine one-actor-per-process deployment (ACTOR_NODE_CAPACITY=1) — N
# identical replicas behind one Service would mean requests randomly land
# on N different Actors' processes even though it's the SAME actor_id, an
# ambiguity this Actor Runtime does not resolve (only ONE of the N would
# actually hold the actor's registry lease and reach READY; the others
# would sit at SCHEDULED_ELSEWHERE/RESTORING forever, wasting the
# resource, not causing corruption — the Actor Registry lease still
# closes the split-brain risk, but this is not the intended shape).
#
# ACTOR_NODE_CLASS distinguishes CLOUD/EDGE/DEVICE/ROBOT scheduling intent
# only (docs/ACTOR_SCHEDULER.md) — it selects NOTHING about which
# cognitive code runs. The Actor abstraction is identical regardless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitiveos-actor-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: cognitiveos-actor
    component: actor-runtime
    actor-id: "${ACTOR_ID}"
    node-class: "${ACTOR_NODE_CLASS}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cognitiveos-actor
      actor-id: "${ACTOR_ID}"
  template:
    metadata:
      labels:
        app: cognitiveos-actor
        actor-id: "${ACTOR_ID}"
        node-class: "${ACTOR_NODE_CLASS}"
    spec:
      # Grants only what rbac.yaml's Role allows (apps/deployments
      # get/list/watch/create/patch/update in this namespace) — needed
      # only when this pod's own reconcile() discovers some OTHER actor
      # is UNSCHEDULABLE and KUBERNETES_PROVISIONING_ENABLED=true (see
      # kernel/society/kubernetes_provisioner.py). Strictly additive:
      # with provisioning left at its default (off), this SA's extra
      # permissions are simply never exercised.
      serviceAccountName: cognitiveos-actor-provisioner
      # Real CognitiveActor boot restores belief via ActorStateStore
      # (Mongo) and reconciles through the Actor Lifecycle Controller —
      # heavier than edge_server.py's near-instant boot (a bare
      # EdgeActor object), lighter than the full cloud deployment.yaml's
      # ~295-agent boot (this process hosts exactly one Actor). 60s
      # covers the common case without carrying deployment.yaml's full
      # 120s allowance for a workload this much smaller in scope.
      terminationGracePeriodSeconds: 60
      # Same finding/fix as deployment.yaml's own initContainers comment
      # -- this pod reads the same agentos-config Redis/Mongo/NATS
      # endpoints and has no other startup ordering guarantee.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for target in redis:6379 mongodb:27017 nats:4222; do
                host="${target%%:*}"; port="${target##*:}"
                until nc -z -w2 "$host" "$port"; do
                  echo "waiting for $target..."
                  sleep 2
                done
                echo "$target is up"
              done
      containers:
        - name: cognitiveos-actor
          image: monkeybrain/agentos:latest
          # See deployment.yaml's imagePullPolicy comment -- same fix,
          # same reason (confirmed live this pass: actor pods hung in
          # "Pulling image" identically to the control-plane pod).
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - src.monkey_brain.actor_runtime:app
            - --host
            - "0.0.0.0"
            - --port
            - "8051"
          ports:
            - containerPort: 8051
              name: http
          envFrom:
            - configMapRef:
                name: agentos-config
                # Same shared Redis/Mongo/Neo4j/NATS endpoints the cloud
                # deployment uses (Section 17: never hard-code a specific
                # node's address) — this Actor's Registry/state/world
                # access is the SAME Society infrastructure, regardless
                # of where this particular Actor executes.
          env:
            - name: ACTOR_ID
              value: "${ACTOR_ID}"
            - name: ACTOR_NODE_CLASS
              value: "${ACTOR_NODE_CLASS}"
            - name: ACTOR_NODE_CAPACITY
              value: "1"
            - name: ACTOR_CLAIM_PLACEMENT
              # This deployment IS the placement decision for this
              # specific actor_id (Section 19) -- an operator rendering
              # this template for ACTOR_ID=alice is explicitly choosing
              # to host alice here, not asking the Scheduler to pick
              # among several candidate nodes for her.
              value: "true"
            - name: ACTOR_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Real, live-confirmed root cause of recurring "Actor ... was
            # not reached by its effective societies" / lease-reconciliation
            # churn: PlanetaryRuntime.__init__ (kernel/society/
            # integration.py) falls back to `f"node-{uuid4().hex[:12]}"`
            # for its OWN node identity whenever COGNITIVEOS_NODE_ID is
            # unset — a brand-new random identity on EVERY restart. Every
            # restart of this Pod therefore looked like an entirely new,
            # unrelated node claiming the same actor to the rest of the
            # system, not the same node reconnecting, defeating the
            # Actor Registry's whole "who owns this actor" bookkeeping
            # (kernel/society/actor_scheduler.py's SchedulingDecision.
            # node_id, ActorRegistryEntry.node_id) across restarts. This
            # value is deterministic per actor_id (matches this
            # Deployment's own Service name, service.yaml/this file's
            # own metadata.name), so it's stable across every restart —
            # also what api/routes/prompt.py's central-control-plane
            # forward-to-dedicated-Pod fallback checks for.
            - name: COGNITIVEOS_NODE_ID
              value: "cognitiveos-actor-${ACTOR_ID}"
            - name: ACTOR_ARTIFACT_VERSION
              # Live Deployment Validation finding: `envsubst` (this
              # template's own documented rendering tool, see the header
              # comment) only does plain $VAR/${VAR} substitution -- it
              # does NOT support bash's ${VAR:-default} parameter
              # expansion syntax the previous value used. Confirmed live:
              # following the header's own documented envsubst invocation
              # exactly rendered this literally as the string
              # "${ACTOR_ARTIFACT_VERSION:-1.0.0}", not a real version.
              # Plain ${ACTOR_ARTIFACT_VERSION} substitutes correctly (to
              # empty string if unset, matching envsubst's normal
              # behavior for any other unset var in this same template) --
              # callers needing a real default should pass
              # ACTOR_ARTIFACT_VERSION=1.0.0 explicitly, as this file's
              # own header example already does.
              value: "${ACTOR_ARTIFACT_VERSION}"
            # See deployment.yaml's identical env var comment — a
            # containerized Ollama sidecar failed four times (`ollama
            # pull` reproducibly timing out over HTTPS from inside this
            # cluster's pod network, even with HTTP/2 disabled). Points
            # at this host's own already-populated native Ollama
            # instead, reached the same way by every Pod in the cluster.
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            # See deployment.yaml's identical env var comment -- llama-
            # server (llama.cpp) replaced Ollama as the default provider
            # (configmap.yaml's MODEL_BACKEND).
            - name: LLAMACPP_BASE_URL
              value: "http://host.docker.internal:8090"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: neo4j-password
            - name: MOSS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: moss-project-id
            - name: MOSS_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: moss-project-key
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: internal-service-token
          resources:
            # Deliberately smaller than deployment.yaml's cloud footprint
            # (Section 14: different Actors may require radically
            # different resources) -- an operator deploying a
            # heavier/GPU-bound Actor overrides these per rendering, the
            # Scheduler's own ActorPlacementRequirements is the
            # placement-time expression of the same idea
            # (docs/ACTOR_SCHEDULER.md).
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /live
              port: 8051
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # /ready returns 503 until this specific actor_id is
            # confirmed ACTIVE and resident HERE (not merely "process
            # started") -- see ActorRuntime.status()'s ReadinessState.
            httpGet:
              path: /ready
              port: 8051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /live
              port: 8051
            periodSeconds: 5
            failureThreshold: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cognitiveos-actor-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: cognitiveos-actor
    actor-id: "${ACTOR_ID}"
spec:
  selector:
    app: cognitiveos-actor
    actor-id: "${ACTOR_ID}"
  ports:
    - port: 8051
      targetPort: 8051
      protocol: TCP
      name: http
  type: ClusterIP
