apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos
  namespace: monkeybrain
  labels:
    app: agentos
    component: cognitive-runtime
spec:
  # Pinned at 1, not an oversight. UPDATE: all four blockers this comment
  # originally documented are now fixed at the code level. (1) kernel/
  # compile/world_tensor.py defaults (AGENTOS_WORLD_BACKEND=auto) to a
  # shared, Redis-backed, per-tenant store instead of one process-global,
  # last-write-wins local file. (2) SocietyGovernanceEngine (kernel/
  # society/governance.py) policies/permissions/trust/safety/audit now all
  # persist through PlanetaryRuntime._save_societies()/_load_societies()
  # on every live mutation. (3) PlanetaryRuntime.unregister_actor() now
  # checkpoints belief before removing an actor and searches every managed
  # society, not only the default one. (4) SocietyRuntime._message_queue
  # is now backed by a durable, per-actor Redis inbox (PlanetaryRuntime.
  # push_actor_message/drain_actor_inbox) instead of an in-process list.
  #
  # This is NOT the same claim as "validated safe at replicas > 1 in
  # production." Every fix above was verified by direct code tracing and
  # unit tests against Redis fakes — no process was actually run at
  # replicas > 1 against real load or a real Redis cluster as part of this
  # work. Raising this value is now a deliberate operator decision to make
  # after real multi-replica validation, not a decision this file makes
  # for you. See DEPLOYMENT_ARCHITECTURE.md's Section 10 for the full,
  # itemized history of what was fixed and what remains unverified.
  replicas: 1
  selector:
    matchLabels:
      app: agentos
  template:
    metadata:
      labels:
        app: agentos
    spec:
      # KubernetesProvisioner RBAC: grant permissions to create Deployments
      # when provisioning actors on demand. Least-privilege: only what
      # provisioning needs (apps/deployments, get/list/watch/create/patch/update,
      # monkeybrain namespace only). See deploy/k8s/rbac.yaml for the Role/
      # RoleBinding definitions. This is the second half of the Gap Remediation
      # audit fix (kubernetes_provisioner.py is the first half).
      serviceAccountName: cognitiveos-actor-provisioner
      # Gate 11 (production readiness): default is 30s. Real, live-observed
      # planetary ticks and /actors/{id}/execute calls run 30-90s+ (serial,
      # LLM-planner-bound — see docs/adr/016-performance-gate9.md); the
      # default grace period risks a SIGKILL mid-tick on every rolling
      # deploy or node drain. 120s covers the common case with margin.
      # /compare's rare, heavier pipeline (server-declared ceiling: 600s,
      # predict.py's COMPARE_TOTAL_TIMEOUT) is NOT fully covered by this —
      # a pod terminated mid-/compare can still be cut off. Not raised to
      # 600s+ because that would make every rolling deploy/scale-down
      # operation wait up to 10 minutes per pod; documented trade-off, not
      # an oversight.
      terminationGracePeriodSeconds: 120
      # Live Deployment Validation finding: docker-compose.yml gates
      # agentos on `depends_on: condition: service_healthy` for mongodb/
      # redis/nats/opa -- Kubernetes Deployments have no equivalent
      # primitive, and this manifest never replicated that guarantee any
      # other way. Confirmed live: applying the full stack in one batch
      # (the normal `kubectl apply -k` case, e.g. right after a fresh
      # `kind create cluster`) let this pod start before NATS was ready;
      # its own PlanetaryRuntime boot phase burned its full 60s timeout
      # retrying a still-starting NATS, then CrashLoopBackOff added more
      # delay on top before it self-healed. This initContainer is the
      # standard Kubernetes equivalent of docker-compose's
      # service_healthy gate -- it blocks Pod startup (not just the app's
      # own internal boot-phase retry) until every dependency this
      # ConfigMap actually points at is accepting TCP connections.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for target in redis:6379 mongodb:27017 nats:4222 opa:8181 neo4j:7687; do
                host="${target%%:*}"; port="${target##*:}"
                until nc -z -w2 "$host" "$port"; do
                  echo "waiting for $target..."
                  sleep 2
                done
                echo "$target is up"
              done
      containers:
        - name: agentos
          image: monkeybrain/agentos:latest
          # Live Deployment Validation finding: a `:latest` tag makes
          # Kubernetes default imagePullPolicy to Always, so a locally
          # built/kind-loaded image (this repo has no registry this
          # image is ever pushed to) is ignored -- kubelet tries a real
          # registry pull and hangs/fails ImagePullBackOff. Confirmed
          # live: every pod using this image stuck in "Pulling image"
          # until this was set. IfNotPresent uses the node's already-
          # loaded/built image instead of assuming a registry exists.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8031
              name: http
          envFrom:
            - configMapRef:
                name: agentos-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            # /live (Gate 8): depends on nothing but the ASGI server
            # itself responding — the correct, minimal liveness check.
            # Was /health, which additionally depends on Lemon having
            # booted correctly; a Lemon-internals problem is a real but
            # different failure mode that shouldn't by itself restart
            # the pod. /health remains available as a more detailed
            # status endpoint (still no external-dependency gating).
            httpGet:
              path: /live
              port: 8031
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8031
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            # Confirmed live this session: a full boot (real Mongo/
            # Redis/Neo4j connections, ~295 agents registered) commonly
            # takes 30-77s+ depending on load. Without a startupProbe,
            # livenessProbe's initialDelaySeconds=15 + failureThreshold=3
            # * periodSeconds=30 gives ~105s before a slow-but-healthy
            # boot gets killed and restart-looped — too tight for the
            # slower end of what's actually been observed.
            #
            # Live Deployment Validation finding: raised further
            # (150s -> 600s budget) alongside configmap.yaml's
            # KERNEL_PHASE_TIMEOUT=180 -- /live only starts responding
            # AFTER Kernel.boot() either completes or a phase raises
            # (uvicorn's ASGI app isn't live until the FastAPI lifespan
            # startup returns), so raising the per-phase timeout without
            # raising this budget to match would just trade a boot-phase
            # timeout crash for a startupProbe-kill crash on the exact
            # same slow-but-healthy boot.
            httpGet:
              path: /live
              port: 8031
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          env:
            # A containerized Ollama sidecar (per-actor, then a single
            # shared one here) was tried and reverted FOUR times: image
            # pulls fine, but `ollama pull` (fetching a model manifest)
            # reproducibly times out after exactly 30s over HTTPS from
            # inside this cluster's pod network — even with HTTP/2
            # explicitly disabled (GODEBUG=http2client=0). A plain
            # busybox wget against the SAME host succeeds fine, so this
            # is specific to Ollama's own Go HTTP client in this
            # environment (possibly Cloudflare edge-blackholing its
            # traffic pattern), not a general connectivity gap. Points
            # at this host's own already-populated native Ollama
            # instead — host.docker.internal resolves inside pods here
            # (Docker Desktop injects it cluster-wide, confirmed live).
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            # llama-server (llama.cpp's OpenAI-compatible server, distinct
            # process/port from Ollama above) -- see configmap.yaml's
            # MODEL_BACKEND comment for why this replaced Ollama as the
            # default provider. Same host.docker.internal pattern, same
            # reasoning (native on this host, not a containerized sidecar).
            - name: LLAMACPP_BASE_URL
              value: "http://host.docker.internal:8090"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: neo4j-password
            - name: MOSS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: moss-project-id
            - name: MOSS_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: moss-project-key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: openrouter-api-key
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: internal-service-token
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: access-token-secret
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: refresh-token-secret
            - name: AGENTOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: agentos-api-key
            # Actors default to edge: this control-plane Pod is the
            # scheduler/API/registry surface, not an actor-hosting node.
            # Tried disabling self-registration entirely first
            # (SCHEDULER_SELF_REGISTER=false) so list_nodes() would be
            # empty -- confirmed LIVE that this backfires: an empty node
            # list hits ActorScheduler.schedule()'s OWN "no nodes
            # registered -- unmanaged single-node mode" early return
            # (scheduled=True, unconstrained) before it ever reaches the
            # "no healthy nodes registered" UNSCHEDULABLE reason
            # kubernetes_provisioner.should_provision() matches on -- so
            # disabling registration just reproduces the exact same
            # "runs on the control plane" behavior one step earlier,
            # never triggering provisioning at all.
            #
            # Correct fix: stay registered (a REAL, healthy node genuinely
            # exists) but with zero actor-hosting capacity, so schedule()
            # exits unmanaged mode, evaluates real candidates, and finds
            # none available -- ActorScheduler._summarize_no_candidate_
            # reason()'s "no healthy node has available capacity" string
            # (kubernetes_provisioner.should_provision(), expanded to
            # match this reason too) is exactly the same class of gap
            # "no healthy nodes registered" already covers ("nothing
            # exists to host ANY actor yet"), just reached via a real
            # node with 0 capacity instead of literally zero nodes.
            - name: SCHEDULER_NODE_CLASS
              value: "cloud"
            - name: SCHEDULER_NODE_CAPACITY
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          # Was emptyDir (state lost on every restart/reschedule) — a real
          # correctness bug for a runtime whose whole point is a persistent
          # world. See pvc.yaml for why ReadWriteOnce is the right access
          # mode here, not a shortcut.
          persistentVolumeClaim:
            claimName: agentos-data
