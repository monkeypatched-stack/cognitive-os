# CognitiveOS Workspace (apps/workspace) — the Next.js frontend the
# voice -> simulated drone flight + live camera demo runs from
# (docs/VOICE_DRONE_FLIGHT_DEMO.md). Sibling of frontend-deployment.yaml
# (living-world-explorer, a different app) — additive, never touches that
# deployment or anything else already running in this namespace.
#
# Built via docker/services/workspace/Dockerfile (multi-stage: `next build`
# then `next start`, a real Node server so next.config.ts's rewrites() can
# still proxy /api/* to Kong server-side, the same mechanism `next dev`
# uses locally) — unlike frontend-deployment.yaml's static SPA-behind-nginx
# shape, this app needs an actual Node runtime for that proxy.
#
# Deployed/torn down via scripts/workspace_demo_stack.sh — scoped to
# exactly these two resources, never the rest of the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: monkeybrain
  labels:
    app: workspace
    component: voice-drone-flight-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      containers:
        - name: workspace
          image: monkeybrain/workspace:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          # NO env: block for NEXT_PUBLIC_API_TARGET/NEXT_PUBLIC_LIVEKIT_URL
          # here -- Next.js resolves NEXT_PUBLIC_* vars once, at `next
          # build` time (confirmed live: a Deployment-level override had
          # zero effect on an already-built image). They're baked into
          # the image instead, via --build-arg in
          # scripts/workspace_demo_stack.sh (targets kong-proxy's
          # in-cluster DNS name by default). A genuinely different target
          # means rebuilding the image with a different build-arg, not
          # editing this manifest.
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workspace
  namespace: monkeybrain
  labels:
    app: workspace
spec:
  selector:
    app: workspace
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP
