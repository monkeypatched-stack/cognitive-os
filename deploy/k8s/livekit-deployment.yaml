# LiveKit server for the voice/camera demo (docs/VOICE_DRONE_FLIGHT_DEMO.md).
# SIMULATION/DEMO-ONLY dev credentials (LIVEKIT_KEYS below) -- same
# "insecure dev mode, explicit and documented" posture already established
# for this cluster's other demo-only config, never meant for a real
# deployment. Additive to the namespace: does not touch agentos/auth/
# mongodb/kong/drones -- only the agentos Deployment's own env (LIVEKIT_URL/
# LIVEKIT_API_KEY/LIVEKIT_API_SECRET, applied separately via `kubectl set
# env`, matching these same devkey/devsecret values) needs to agree with
# this server's keys to mint tokens it will actually accept.
#
# Known limitation: kubectl port-forward (how the browser reaches this
# cluster, see scripts/livekit_demo_stack.sh) only forwards TCP. WebRTC
# media normally prefers UDP/ICE; --dev mode plus forcing TCP below
# (RTC_FORCE_TCP) makes the SIGNALING connection and, best-effort, media
# work through that TCP-only tunnel, but this network path (kind cluster ->
# port-forward -> browser) was never a production LiveKit deployment
# topology -- verify actual audio/video flow live, don't assume it from
# this manifest alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: monkeybrain
  labels:
    app: livekit
    component: voice-drone-flight-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # Kubernetes auto-injects a LIVEKIT_PORT=tcp://<cluster-ip>:7880 env
      # var into every pod in this namespace once the Service below exists
      # (the standard <SVCNAME>_PORT convention) -- LiveKit server ALSO
      # reads LIVEKIT_PORT as its own --port flag's env override, so the
      # two collide (confirmed live: "could not parse tcp://... as uint
      # value... for flag port", crash-looping). enableServiceLinks: false
      # is the standard fix, not a workaround specific to this one name.
      enableServiceLinks: false
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--bind"
            - "0.0.0.0"
          env:
            # Single source of truth for keys/rtc/turn below -- kept as one
            # config-body rather than split across LIVEKIT_KEYS/
            # LIVEKIT_RTC_FORCE_TCP env vars (the previous approach) so the
            # turn: section isn't fighting a separately-set force_tcp flag
            # for the same rtc struct.
            #
            # WHY turn_servers exists at all -- confirmed live that a
            # direct host ICE-TCP candidate (this Deployment's own
            # signaling/rtc-tcp ports, reached via kubectl port-forward)
            # can NEVER work for an external browser here: LiveKit can only
            # advertise ONE node address for host candidates, and that
            # address is either the pod's cluster-internal IP (works for
            # agentos's in-cluster LiveKitVoiceObservationProvider and the
            # drone's camera-bridge, NOT reachable from the Mac browser at
            # all -- verified live, Docker Desktop does not route pod/
            # kind-node IPs to the host) or 127.0.0.1 (works for the
            # port-forwarded browser, but then means the pod itself for
            # every in-cluster caller -- verified live this breaks BOTH the
            # voice listener, "wait_pc_connection timed out", and would
            # equally break the camera publisher on its next reconnect). No
            # single node_ip satisfies both.
            #
            # This SFU's own EMBEDDED turn: block (tried first) sidesteps
            # that node_ip conflict but hits a different, confirmed-live
            # dead end: the embedded TURN server shares this same pod/
            # process, so the SFU's connectivity checks against its own
            # relay candidate are a same-pod hairpin -- allocation succeeds
            # (relay candidate gathered fine) but the SFU's STUN checks
            # against it get zero responses every time (pion-turn
            # limitation, not a network issue -- raw UDP hairpin to this
            # pod's own IP on a different port works fine at the OS level,
            # confirmed live). A genuinely separate pod (coturn-
            # deployment.yaml) doesn't have that problem: the SFU reaches
            # coturn's relay over ordinary pod-to-pod networking, and the
            # browser only ever needs coturn's own control-channel address
            # (port-forwarded turn.localhost:5350 below), never a second
            # "relay candidate" address the way peer-to-peer TURN would.
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                rtc:
                  tcp_port: 7881
                  use_external_ip: false
                  turn_servers:
                    - host: turn.localhost
                      port: 5350
                      protocol: tls
                      # SIMULATION/DEMO-ONLY -- must match coturn-
                      # deployment.yaml's own coturn-config ConfigMap's
                      # `user=` line exactly.
                      username: devturnuser
                      credential: devturnpass
                keys:
                  # SIMULATION/DEMO-ONLY -- see module header.
                  devkey: devsecret_at_least_32_characters_long
          ports:
            - containerPort: 7880
              name: signaling
            - containerPort: 7881
              name: rtc-tcp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: monkeybrain
  labels:
    app: livekit
spec:
  selector:
    app: livekit
  ports:
    - port: 7880
      targetPort: 7880
      protocol: TCP
      name: signaling
    - port: 7881
      targetPort: 7881
      protocol: TCP
      name: rtc-tcp
  type: ClusterIP
