# NetworkPolicies for the monkeybrain namespace — Gap Remediation audit
# finding: no NetworkPolicy existed anywhere under deploy/k8s/, so every
# pod in the namespace (Society control-plane, per-actor Actor Runtime
# pods, OPA) accepted traffic from anywhere in the cluster by default.
#
# Deliberately a minimal, additive baseline, not a full mesh-authorization
# rewrite (that is TransitionGate/OPA's job at the application layer,
# already enforced independently — see opa.yaml/require_opa()). This only
# closes the "any pod in the cluster can reach any port of any pod here"
# default-open gap:
#
#   1. default-deny-all: baseline — nothing is reachable unless a
#      later policy explicitly allows it. NetworkPolicies are additive
#      (multiple policies selecting the same pod OR together), so this
#      is always safe to apply alongside the allow-rules below.
#   2. allow-intra-namespace: every pod in monkeybrain may reach every
#      other pod in monkeybrain on any port — this is the Society Bus
#      (NATS pub/sub between actors), Actor Runtime -> Redis/Mongo/OPA,
#      and the Society API -> actor pods reconciliation traffic. Scoping
#      this port-by-port would require hand-maintaining a port list that
#      already drifts across configmap.yaml/docker-compose.yml (see the
#      REDIS_PORT/MONGODB_URL comments there) — namespace-scoped instead
#      of cluster-wide is the actual gap being closed here.
#   3. allow-dns-egress: every pod needs to resolve Service DNS names
#      (redis, mongodb, nats, opa, ...) regardless of the deny-all above
#      — kube-dns/CoreDNS normally lives in kube-system, outside this
#      namespace, so it needs its own explicit egress allow.
#   4. allow-metrics-scrape: Prometheus (servicemonitor.yaml) needs
#      ingress to the /metrics port from OUTSIDE this namespace. Scoped
#      via namespaceSelector matching a "monitoring" namespace label —
#      adjust the label selector below to match your cluster's actual
#      Prometheus operator namespace if it differs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monkeybrain
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: monkeybrain
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: monkeybrain
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Actors default to edge: KubernetesProvisioner (kernel/society/
# kubernetes_provisioner.py) shells out to `kubectl apply` from inside
# the agentos Pod (RBAC already scoped for this — see rbac.yaml) whenever
# an actor needs its own dedicated Pod. Confirmed live this was missing:
# default-deny-all correctly blocks ALL egress not explicitly allowed,
# including the kube-apiserver itself (which lives outside this
# namespace, so allow-intra-namespace doesn't cover it) -- every
# provisioning attempt hung for the full 30s subprocess timeout and
# failed. The apiserver's in-cluster ClusterIP is the standard
# `kubernetes.default.svc` address (10.96.0.1 here; the well-known
# default Service CIDR's first address on any cluster using it) --
# scoped to just the agentos Pod, the only one that ever runs kubectl.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentos-to-apiserver
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: agentos
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: agentos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8031
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-kong
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
# Same shape as allow-external-to-kong above — the frontend Pod is the
# other real ingress-facing surface (browser -> nginx), reached the same
# way (kubectl port-forward on kind; a real Ingress/LoadBalancer on a real
# cluster). frontend -> kong-proxy itself is already covered by
# allow-intra-namespace, so this only needs to open inbound.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-frontend
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong-to-agentos
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: agentos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - protocol: TCP
          port: 8031
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentos-to-actor-runtime
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: cognitiveos-actor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agentos
      ports:
        - protocol: TCP
          port: 8051
---
# Same shape/precedent as allow-agentos-to-apiserver above (scoped ipBlock
# + port, not a blanket external-egress hole) -- confirmed live this was
# the OTHER missing default-deny-all exception: both agentos.yaml and
# actor-deployment.yaml/drone-actor-deployment.yaml point OLLAMA_BASE_URL/
# LLAMACPP_BASE_URL at host.docker.internal (this cluster has no in-cluster
# LLM backend; see those files' own comments on the containerized-Ollama-
# sidecar dead end), which resolves to the Docker Desktop host gateway.
# Before this policy, every LLM planning call from every Pod silently
# failed closed -- `agentos.pipeline.llm_planner: planning failed: ` with
# an EMPTY exception message (an asyncio.TimeoutError, whose str() is "")
# -- easy to misread as an application bug; confirmed live via iptables
# counters that pod-sourced SYNs to this address never reach the node's
# own NAT chain at all, while `docker exec <node> curl` (the node's own
# netns) succeeds, i.e. default-deny-all was doing exactly its job, not a
# CNI bug. 192.168.65.254 is Docker Desktop's own documented vpnkit
# gateway address for host.docker.internal (also what the
# DOCKER_POSTROUTING chain's own DNS SNAT rule already targets on this
# same host) -- stable for a given Docker Desktop install, not something
# this cluster invents. Port 8090 (llama-server, the default provider —
# see configmap.yaml's MODEL_BACKEND) added alongside 11434 (Ollama, kept
# reachable as a fallback provider, not removed). Port 8091 added for the
# same reason as 8090: scripts/voice_service/transcription_service.py is
# ANOTHER native-Mac process (mlx-whisper needs Metal/MPS, which Docker
# Desktop's Linux VM can't pass through to a container any more than it
# can for llama-server's own GPU use) that agentos's
# LiveKitVoiceObservationProvider (kernel/edge/livekit_adapter.py) now
# calls over HTTP instead of running Whisper in-process.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-llm-egress-to-ollama-host
  namespace: monkeybrain
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - agentos
          - cognitiveos-actor
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.65.254/32
      ports:
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8091
---
# LiveKit Cloud egress -- switched to this from the self-hosted in-cluster
# livekit-deployment.yaml/coturn-deployment.yaml after confirming live that
# no combination of node_ip/embedded TURN/standalone coturn could make a
# kubectl-port-forwarded external browser's WebRTC media reach a
# kind-cluster-hosted LiveKit reliably (see those two files' own header
# comments for the full history: embedded-TURN same-pod hairpin fails
# pion-turn's own connectivity checks; standalone coturn fixed that but a
# non-Mac client, e.g. a phone on the LAN, has no way to resolve
# `localhost`/`turn.localhost` to the Mac's port-forward at all). LiveKit
# Cloud is a normal publicly-reachable wss:// endpoint, so every client
# (Mac browser, phone, in-cluster pods) reaches the exact same real address
# with no NAT/hairpin/port-forward involved.
#
# Broad 0.0.0.0/0:443 rather than a pinned ipBlock (contrast the Ollama
# rule above) because LiveKit Cloud is a multi-tenant hosted service behind
# a CDN/load balancer -- its resolved IPs are not fixed the way a single
# Docker Desktop host gateway address is, so there is no single IP to pin
# without this breaking on LiveKit's own infrastructure changes.
# cognitiveos-actor pods (e.g. cognitiveos-actor-drone-a) run
# run_ros_action_if_governed's real flight calls against ROS_BRIDGE_URL --
# px4-sim-<actor-id>'s own ros-bridge container, on THIS SAME single-node
# kind cluster's node (hostNetwork: true, deploy/k8s/px4-sim-deployment
# .yaml's own comment on why). Confirmed live: allow-intra-namespace's
# podSelector-based rule does NOT cover this -- a hostNetwork Pod has no
# real pod IP of its own for a podSelector-based NetworkPolicy to match
# against (it shares the node's network namespace entirely), so egress to
# it needs an ipBlock rule keyed on the NODE's IP instead, same shape as
# allow-llm-egress-to-ollama-host above. A curl from inside
# cognitiveos-actor-drone-a to px4-sim-drone-a's own ros-bridge port timed
# out completely before this rule existed, hanging every flight command
# indefinitely (governance passed, then nothing -- no error, no
# completion) even though that same port answered fine to itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-actor-egress-to-px4-sim
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: cognitiveos-actor
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.19.0.2/32
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
        - protocol: TCP
          port: 9002
        - protocol: TCP
          port: 9003
        - protocol: TCP
          port: 8761
        - protocol: TCP
          port: 8762
        - protocol: TCP
          port: 8763
        - protocol: TCP
          port: 8765
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-livekit-cloud-egress
  namespace: monkeybrain
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - agentos
          - cognitiveos-actor
          - px4-sim
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
