# NetworkPolicies for the monkeybrain namespace — Gap Remediation audit
# finding: no NetworkPolicy existed anywhere under deploy/k8s/, so every
# pod in the namespace (Society control-plane, per-actor Actor Runtime
# pods, OPA) accepted traffic from anywhere in the cluster by default.
#
# Deliberately a minimal, additive baseline, not a full mesh-authorization
# rewrite (that is TransitionGate/OPA's job at the application layer,
# already enforced independently — see opa.yaml/require_opa()). This only
# closes the "any pod in the cluster can reach any port of any pod here"
# default-open gap:
#
#   1. default-deny-all: baseline — nothing is reachable unless a
#      later policy explicitly allows it. NetworkPolicies are additive
#      (multiple policies selecting the same pod OR together), so this
#      is always safe to apply alongside the allow-rules below.
#   2. allow-intra-namespace: every pod in monkeybrain may reach every
#      other pod in monkeybrain on any port — this is the Society Bus
#      (NATS pub/sub between actors), Actor Runtime -> Redis/Mongo/OPA,
#      and the Society API -> actor pods reconciliation traffic. Scoping
#      this port-by-port would require hand-maintaining a port list that
#      already drifts across configmap.yaml/docker-compose.yml (see the
#      REDIS_PORT/MONGODB_URL comments there) — namespace-scoped instead
#      of cluster-wide is the actual gap being closed here.
#   3. allow-dns-egress: every pod needs to resolve Service DNS names
#      (redis, mongodb, nats, opa, ...) regardless of the deny-all above
#      — kube-dns/CoreDNS normally lives in kube-system, outside this
#      namespace, so it needs its own explicit egress allow.
#   4. allow-metrics-scrape: Prometheus (servicemonitor.yaml) needs
#      ingress to the /metrics port from OUTSIDE this namespace. Scoped
#      via namespaceSelector matching a "monitoring" namespace label —
#      adjust the label selector below to match your cluster's actual
#      Prometheus operator namespace if it differs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monkeybrain
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: monkeybrain
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: monkeybrain
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Actors default to edge: KubernetesProvisioner (kernel/society/
# kubernetes_provisioner.py) shells out to `kubectl apply` from inside
# the agentos Pod (RBAC already scoped for this — see rbac.yaml) whenever
# an actor needs its own dedicated Pod. Confirmed live this was missing:
# default-deny-all correctly blocks ALL egress not explicitly allowed,
# including the kube-apiserver itself (which lives outside this
# namespace, so allow-intra-namespace doesn't cover it) -- every
# provisioning attempt hung for the full 30s subprocess timeout and
# failed. The apiserver's in-cluster ClusterIP is the standard
# `kubernetes.default.svc` address (10.96.0.1 here; the well-known
# default Service CIDR's first address on any cluster using it) --
# scoped to just the agentos Pod, the only one that ever runs kubectl.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentos-to-apiserver
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: agentos
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: agentos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8031
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-kong
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
# Same shape as allow-external-to-kong above — the frontend Pod is the
# other real ingress-facing surface (browser -> nginx), reached the same
# way (kubectl port-forward on kind; a real Ingress/LoadBalancer on a real
# cluster). frontend -> kong-proxy itself is already covered by
# allow-intra-namespace, so this only needs to open inbound.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-frontend
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong-to-agentos
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: agentos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - protocol: TCP
          port: 8031
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentos-to-actor-runtime
  namespace: monkeybrain
spec:
  podSelector:
    matchLabels:
      app: cognitiveos-actor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agentos
      ports:
        - protocol: TCP
          port: 8051
