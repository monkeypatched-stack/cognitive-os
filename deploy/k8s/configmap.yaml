apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-config
  namespace: monkeybrain
data:
  # llama.cpp (a native `llama-server` process on this host, port 8090)
  # replaced Ollama as the primary provider: Ollama's own HTTP round-trip
  # plus llm_planner.py's retry-on-degenerate-confidence (up to 3 calls
  # per plan) could together exceed Kong's agentos-service gateway
  # timeout — confirmed live as a 504 upstream timeout on this exact
  # workload. llama-server, serving the SAME gemma-3-4b-it weights
  # directly with no Ollama layer in between, is meaningfully faster per
  # call on this hardware. A containerized sidecar was tried for Ollama
  # (per-actor, then a single shared one) and reverted four times —
  # `ollama pull` reproducibly timed out over HTTPS from inside this
  # cluster's pod network even with HTTP/2 disabled — so llama-server
  # also just runs natively on this host, same host.docker.internal
  # pattern every Pod that needs it (deployment.yaml / actor-
  # deployment.yaml / drone-actor-deployment.yaml) already sets via its
  # own LLAMACPP_BASE_URL. Ollama itself is left running/reachable
  # (OLLAMA_MODEL below, MODEL_BACKEND=ollama) as a fallback provider,
  # not removed.
  MODEL_BACKEND: "llamacpp"
  LLAMACPP_MODEL: "gemma-3-4b-it-Q4_K_M"
  OLLAMA_MODEL: "gemma3:latest"
  # Content-addressed LLM response cache (kernel/pipeline/llm_plan_cache.py,
  # packages/broca/broca/agents/_llm_cache.py) — collapses an identical
  # planning prompt (same goal re-asked, execute+simulate re-planning the
  # same goal) to one real backend call. Real perf win specifically because
  # Ollama planning calls are the slowest step in this pipeline by far (see
  # llm_planner.py's own circuit breaker comment). See also MOSS_PROJECT_ID/
  # KEY in secret.yaml for the SEPARATE semantic (goal-similarity) plan
  # cache, which catches a differently-phrased repeat this exact-match
  # cache always misses.
  LLM_RESPONSE_CACHE: "1"
  LLM_CACHE_DIR: "/tmp/mb-llm-cache"
  LLM_CACHE_MAX: "1024"
  MONGODB_URL: "mongodb://mongodb:27017"
  # Final Conformance run finding (live deployment test): ActorStateStore's
  # own Mongo connection (persistence/db_pool.py) reads DATABASE_URL, NOT
  # MONGODB_URL (which only the Society API's own /health check and a few
  # other call sites use) — a real, pre-existing naming split between
  # subsystems, confirmed live by running a real container against this
  # exact env var set and watching ActorStateStore fail to connect while
  # MONGODB_URL-reading code paths succeeded. Both are set so every
  # subsystem this ConfigMap feeds (deployment.yaml AND actor-deployment.yaml)
  # resolves correctly — this does not rename or unify the application
  # code's own env var conventions, only ensures deployment config
  # supplies every name the code actually reads.
  DATABASE_URL: "mongodb://mongodb:27017/cognitive_platform"
  DB_NAME: "demo"
  REDIS_URL: "redis://redis:6379"
  # Same finding, more severe: PlanetaryRuntime's own Redis client
  # (kernel/society/integration.py — the Actor Registry/Scheduler/
  # Lifecycle Controller/reconciliation-queue substrate this entire
  # session's control-plane work depends on) reads REDIS_HOST/REDIS_PORT,
  # NOT REDIS_URL. Before this fix, NEITHER deployment.yaml NOR
  # actor-deployment.yaml ever supplied these — meaning a real Kubernetes
  # deployment of this application would have booted with
  # PlanetaryRuntime._redis silently None (the documented fail-soft
  # fallback), never actually persisting the Actor Registry/leases/node
  # registry/reconcile queue to Redis at all, with no error surfaced
  # anywhere except a WARNING log line. Confirmed live: a real container
  # run against REDIS_URL alone reproduced exactly this ("Redis not
  # available: ... Connection refused") before REDIS_HOST/REDIS_PORT were
  # added.
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  # Live Deployment Validation finding: NATS_URL was never set anywhere
  # in this ConfigMap even though nats.py's Society Bus connection
  # (PlanetaryRuntime.connect_nats()) reads it — a real Kubernetes
  # deployment previously had no NATS manifest to point at anyway (see
  # nats.yaml, added this pass), so this was a compounding gap, not just
  # a missing env var. Actor-to-Actor communication (AskActorCapability)
  # silently degraded to its in-process fallback with no NATS_URL set.
  NATS_URL: "nats://nats:4222"
  # NEO4J_PASSWORD intentionally NOT here — a ConfigMap is plaintext-
  # visible to anyone who can `kubectl get configmap -o yaml`. It's
  # supplied to the container as a real env var via secret.yaml's
  # agentos-secrets Secret (see deployment.yaml's env: block).
  MB_WORLD_TENSOR: "true"
  # MB_WORLD_TENSOR_PATH is now only the FALLBACK single-file store, used
  # when AGENTOS_WORLD_BACKEND resolves to "memory" or Redis is genuinely
  # unreachable — kernel/compile/world_tensor.py's default
  # (AGENTOS_WORLD_BACKEND=auto, unset here) now prefers the shared,
  # multi-replica-safe Redis-backed store (kernel/compile/
  # redis_world_store.py) whenever REDIS_URL above is reachable, which it
  # already is in this deployment. Left set so a Redis outage still
  # degrades to a working, if process-local, world tensor rather than none
  # at all. See deployment.yaml's `replicas` comment for what this does
  # and does not unblock.
  MB_WORLD_TENSOR_PATH: "/data/world_tensor.json"
  AGENTOS_AUTH_REQUIRED: "true"
  # Was unset here — require_opa()/evaluate_full() (services.common.opa,
  # api/routes/actors.py) uses default_allow (fails OPEN) when OPA_URL is
  # unset, so every require_opa(...) check on every route silently
  # allowed everything in this deployment until opa.yaml's real OPA
  # service existed for this to point at. Setting OPA_URL still matters
  # even now that OPA-unreachable/erroring fails CLOSED (Doot audit
  # P1-6, kernel/governance.py + services.common.opa) — that fix only
  # covers "configured but broken," not "never configured at all," which
  # is what leaving this unset would still mean.
  OPA_URL: "http://opa:8181"
  LOG_LEVEL: "INFO"
  # Live Deployment Validation finding: on this local kind cluster,
  # "Policy Control Plane" / "Graph Store" boot phases repeatedly hit
  # the 60s default (kernel.py's KERNEL_PHASE_TIMEOUT) even with every
  # backing service confirmed Running and independently fast when
  # tested directly (PlanetaryRuntime construction 0.3s, connect_nats()
  # 0.15s via direct in-pod probes) -- consistent with real CPU
  # contention on a single-node local cluster sharing the host's Docker
  # Desktop VM, not a deadlock (each attempt made incremental progress,
  # never the exact same failure point twice). Raised as a deployment-
  # config tuning value, not a code change -- KERNEL_PHASE_TIMEOUT
  # already existed as a documented override point.
  KERNEL_PHASE_TIMEOUT: "180"
  CAPABILITY_TIMEOUT_SECONDS: "120"
  COGNITIVEOS_PRODUCTION_MODE: "true"
  # Temporary, explicit toggle (not insecure-dev-mode) — kernel/
  # production_gates.py::mfa_required()'s last line honors an explicit
  # falsy value here regardless of production mode. Turned off "for now"
  # per direct instruction, so login stays plain email/password without
  # the MFA enroll/challenge flow (living-world-explorer/src/components/
  # LoginPage.tsx). Flip back to "true" (or delete this line — true is the
  # default) to re-require it; nothing else needs to change since the
  # frontend's MFA screens only ever render when the server actually asks
  # for them.
  COGNITIVEOS_MFA_REQUIRED: "false"
  API_GATEWAY_REQUIRED: "true"
  ACTOR_RUNTIME_INTERNAL_ONLY: "true"
  # KubernetesProvisioner enablement (Gap Remediation audit fix):
  # When true, the Lifecycle Controller will attempt to create Actor Pods
  # via `kubectl apply` when an actor is UNSCHEDULABLE due to "no healthy
  # nodes registered" — closing the gap where the Scheduler placement
  # decision had no path to actually materialize a Pod. Opt-in, default
  # false — deployments without kubectl/RBAC configured see zero behavior
  # change. See docs/KUBERNETES_PROVISIONER_ENABLEMENT.md and
  # src/monkey_brain/kernel/society/kubernetes_provisioner.py for details.
  KUBERNETES_PROVISIONING_ENABLED: "true"
  # SPIFFE/SPIRE workload identity (kernel/workload_identity.py). This
  # trust domain MUST match deploy/k8s/spire-server.yaml's ConfigMap
  # (one value, not duplicated/hard-coded per subsystem) and MUST differ
  # from any local-dev trust domain (docker-compose.spire.yml) -- see
  # docs/SPIFFE_SPIRE_IDENTITY.md.
  SPIFFE_TRUST_DOMAIN: "cognitiveos.production"
  # Empty here deliberately: this ConfigMap alone does not turn on real
  # SPIFFE identity for agentos/actor pods -- that also requires the
  # spire-agent socket volume mount + SPIFFE_ENDPOINT_SOCKET env var this
  # repo does NOT add automatically to deployment.yaml/actor-deployment.yaml
  # (see deploy/k8s/spire-agent.yaml's trailing comment for why, and the
  # exact diff to apply when you're ready to enable it).
  SPIFFE_ENDPOINT_SOCKET: ""
  # Fail loudly instead of silently degrading to self-asserted agent
  # identity once SPIRE is actually deployed and wired -- see
  # kernel/domains/grocery.py's Communication Boundary and
  # actor_runtime.py's /execute for the enforcement points. Non-negotiable
  # rule 12 already enforces this unconditionally under
  # COGNITIVEOS_PRODUCTION_MODE=true (set above) regardless of this value;
  # it exists so an operator can also verify the refusal path before
  # relying on production mode alone.
  COGNITIVEOS_REQUIRE_SPIFFE_AGENT_IDENTITY: "false"
