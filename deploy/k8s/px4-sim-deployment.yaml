# PX4 Simulator — the physical (simulated) embodiment for one drone actor,
# now fully separate from the CognitiveOS actor Pod (deploy/k8s/
# drone-actor-deployment.yaml). Same TEMPLATE precedent as
# actor-deployment.yaml (render once PER drone actor_id via envsubst, apply
# directly — not part of kustomization.yaml's static base).
#
#   px4-sitl           — PX4 SITL + Gazebo (px4-sitl-flat:latest — see
#                        drone-actor-deployment.yaml's original header for
#                        why it's a locally re-tagged flattening of
#                        px4io/px4-sitl-gazebo:latest, not the upstream tag
#                        directly).
#   xrce-agent         — Micro XRCE-DDS Agent bridging PX4's own uXRCE-DDS
#                        client to real ROS 2 topics.
#   mavlink-heartbeat  — liveness-only MAVLink HEARTBEAT sender (zero
#                        command authority) satisfying PX4's "No
#                        connection to the GCS" preflight datalink check.
#   ros-bridge         — NEW: the ROS 2/rclpy side of the actor, split out
#                        of the CognitiveOS actor container so THAT
#                        container never needs ROS 2 installed (see
#                        drone-actor-deployment.yaml, now back on the
#                        plain monkeybrain/agentos:latest image). Wraps
#                        kernel/edge/px4_ros_adapter.py::
#                        Px4RosExecutionAdapter (unchanged) behind one
#                        HTTP endpoint (kernel/edge/ros_bridge_server.py,
#                        docker/Dockerfile.ros-bridge) that the
#                        CognitiveOS actor Pod calls via this file's own
#                        Service (kernel/edge/ros_integration.py::
#                        RemoteRosExecutionAdapter, ROS_ADAPTER_KIND=
#                        remote_http).
#   foxglove-bridge    — Live visualization only, zero command authority
#                        (foxglove_bridge just re-publishes existing
#                        topics over its own WebSocket protocol; it never
#                        subscribes to anything under fmu/in/*). ITS OWN
#                        container/resource budget, not squeezed into
#                        xrce-agent's — confirmed live that running
#                        foxglove_bridge as an ad-hoc `kubectl exec`
#                        background process inside xrce-agent's existing
#                        512Mi limit OOM-killed it (and mavlink-heartbeat)
#                        repeatedly, degrading the actual flight-critical
#                        DDS bridge, not just visualization. Also runs a
#                        tiny companion script (gps_bridge.py, mounted
#                        from the ConfigMap below) that republishes
#                        px4_msgs/SensorGps as sensor_msgs/NavSatFix on
#                        /drone/gps/fix -- Foxglove's built-in Map panel
#                        only understands that standard message type, not
#                        PX4's own custom GPS schema, so the Map panel
#                        stays empty against the raw PX4 topic even with
#                        a healthy connection.
#
# All five still share ONE Pod deliberately — same reasoning
# drone-actor-deployment.yaml's original header gave for the whole group:
# PX4's own docker-entrypoint.sh only redirects MAVLink/uXRCE-DDS traffic
# to a host IP when `host.docker.internal` resolves; hostAliases below
# pins that to 127.0.0.1 so it stays targeting this Pod's own network
# namespace. ros-bridge talks to xrce-agent over that same localhost link
# (127.0.0.1:8888, real ROS 2 DDS topics) — keeping it in this Pod is what
# avoids ever needing cross-Pod ROS 2 DDS discovery (kindnet does not
# guarantee multicast across Pods, and this repo has no Discovery-Server/
# static-peers configuration to work around that). Only the CognitiveOS
# actor's own HTTP call to ros-bridge's Service crosses a Pod boundary,
# which needs no such discovery mechanism (plain unicast TCP).
#
#   ACTOR_ID=drone-a PX4_NAMESPACE=px4_a \
#     envsubst '${ACTOR_ID} ${PX4_NAMESPACE}' \
#     < deploy/k8s/px4-sim-deployment.yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: foxglove-gps-bridge-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: px4-sim
    actor-id: "${ACTOR_ID}"
data:
  gps_bridge.py: |
    """Republishes px4_msgs/SensorGps (Foxglove's Map panel doesn't
    recognize this custom PX4 schema) as sensor_msgs/NavSatFix on
    /drone/gps/fix, which Map DOES understand natively. Read-only bridge
    -- subscribes only, no command authority, never publishes under
    fmu/in/*."""
    import rclpy
    from rclpy.node import Node
    from rclpy.qos import QoSProfile, ReliabilityPolicy, DurabilityPolicy, HistoryPolicy
    from px4_msgs.msg import SensorGps
    from sensor_msgs.msg import NavSatFix, NavSatStatus


    class GpsBridge(Node):
        def __init__(self):
            super().__init__("gps_to_navsatfix_bridge")
            qos = QoSProfile(
                reliability=ReliabilityPolicy.BEST_EFFORT,
                durability=DurabilityPolicy.VOLATILE,
                history=HistoryPolicy.KEEP_LAST,
                depth=5,
            )
            self.pub = self.create_publisher(NavSatFix, "/drone/gps/fix", 10)
            self.sub = self.create_subscription(
                SensorGps, "/px4_1/fmu/out/vehicle_gps_position", self.on_gps, qos,
            )
            self.get_logger().info("GPS bridge started: vehicle_gps_position -> /drone/gps/fix")

        def on_gps(self, msg: SensorGps) -> None:
            out = NavSatFix()
            out.header.stamp = self.get_clock().now().to_msg()
            out.header.frame_id = "gps"
            out.status.status = NavSatStatus.STATUS_FIX
            out.status.service = NavSatStatus.SERVICE_GPS
            out.latitude = msg.latitude_deg
            out.longitude = msg.longitude_deg
            out.altitude = msg.altitude_msl_m
            out.position_covariance_type = NavSatFix.COVARIANCE_TYPE_UNKNOWN
            self.pub.publish(out)


    def main():
        rclpy.init()
        node = GpsBridge()
        try:
            rclpy.spin(node)
        finally:
            node.destroy_node()
            rclpy.shutdown()


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: px4-sim-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: px4-sim
    component: px4-simulator
    actor-id: "${ACTOR_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: px4-sim
      actor-id: "${ACTOR_ID}"
  template:
    metadata:
      labels:
        app: px4-sim
        actor-id: "${ACTOR_ID}"
    spec:
      terminationGracePeriodSeconds: 60
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["host.docker.internal"]
      containers:
        - name: px4-sitl
          image: px4-sitl-flat:latest
          imagePullPolicy: IfNotPresent
          tty: true
          stdin: true
          env:
            - name: PX4_UXRCE_DDS_NS
              value: "${PX4_NAMESPACE}"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"

        - name: xrce-agent
          image: cognitiveos-px4-ros2:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc", "MicroXRCEAgent udp4 -p 8888"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        - name: mavlink-heartbeat
          image: cognitiveos-px4-ros2:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c"]
          args:
            - |
              import socket, time
              MAV_TYPE_GCS, MAV_AUTOPILOT_INVALID, MAV_STATE_ACTIVE = 6, 8, 4
              CRC_EXTRA = 50
              def x25crc(data):
                  crc = 0xFFFF
                  for b in data:
                      tmp = b ^ (crc & 0xFF)
                      tmp = (tmp ^ (tmp << 4)) & 0xFF
                      crc = ((crc >> 8) ^ (tmp << 8) ^ (tmp << 3) ^ (tmp >> 4)) & 0xFFFF
                  return crc
              def heartbeat(seq):
                  payload = (0).to_bytes(4, "little") + bytes([MAV_TYPE_GCS, MAV_AUTOPILOT_INVALID, 0, MAV_STATE_ACTIVE, 3])
                  header = bytes([0xFD, len(payload), 0, 0, seq & 0xFF, 255, 190, 0, 0, 0])
                  crc = x25crc(header[1:] + payload + bytes([CRC_EXTRA]))
                  return header + payload + crc.to_bytes(2, "little")
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              seq = 0
              while True:
                  sock.sendto(heartbeat(seq), ("127.0.0.1", 18570))
                  seq += 1
                  time.sleep(1.0)
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

        - name: ros-bridge
          image: monkeybrain/ros-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: ACTOR_ID
              value: "${ACTOR_ID}"
            - name: PX4_NAMESPACE
              value: "${PX4_NAMESPACE}"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

        - name: foxglove-bridge
          # Same image xrce-agent/mavlink-heartbeat already use (confirmed
          # live it has foxglove_bridge, rclpy, and px4_msgs installed) --
          # no new image to build. Own container == own cgroup memory
          # limit, so this can never OOM-starve the flight-critical DDS
          # bridge again the way running it ad-hoc inside xrce-agent did.
          image: cognitiveos-px4-ros2:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              source /opt/ros/jazzy/setup.bash
              source /opt/px4_ws/install/setup.bash
              python3 /scripts/gps_bridge.py &
              exec ros2 run foxglove_bridge foxglove_bridge --ros-args -p port:=8765
          ports:
            - containerPort: 8765
              name: foxglove-ws
          volumeMounts:
            - name: foxglove-gps-bridge-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              # Confirmed live: 512Mi OOM-killed this container twice --
              # bridging all ~70 px4_msgs/* topics (many high-frequency)
              # over one WebSocket server genuinely needs more headroom
              # than a typical single-purpose ROS node.
              memory: "1536Mi"
      volumes:
        - name: foxglove-gps-bridge-script
          configMap:
            name: foxglove-gps-bridge-${ACTOR_ID}
---
apiVersion: v1
kind: Service
metadata:
  name: px4-sim-${ACTOR_ID}
  namespace: monkeybrain
  labels:
    app: px4-sim
    actor-id: "${ACTOR_ID}"
spec:
  selector:
    app: px4-sim
    actor-id: "${ACTOR_ID}"
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: http
    - port: 8765
      targetPort: 8765
      protocol: TCP
      name: foxglove-ws
  type: ClusterIP
