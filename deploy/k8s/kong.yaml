apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: monkeybrain
  labels:
    app: kong
    component: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
        component: api-gateway
    spec:
      containers:
        - name: kong
          image: kong:3.6
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
            - name: KONG_LOG_LEVEL
              value: info
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
              readOnly: true
          # KONG_ADMIN_LISTEN is deliberately 127.0.0.1:8001 (Admin API
          # never exposed outside the Pod -- correct security posture).
          # kubelet's httpGet probes connect from OUTSIDE the container's
          # network namespace via the Pod IP, so they can never reach a
          # loopback-only port -- confirmed live (permanent "connection
          # refused" on both probes even though Kong's own logs showed a
          # fully successful boot). exec probes run inside the container's
          # own namespace, where 127.0.0.1 correctly resolves to Kong
          # itself, without loosening the Admin API's bind address.
          readinessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: monkeybrain
  labels:
    app: kong
    component: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
