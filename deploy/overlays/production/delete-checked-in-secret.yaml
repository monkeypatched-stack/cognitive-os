# Strategic-merge delete patch (kustomize `$patch: delete`): removes the
# base's checked-in deploy/k8s/secret.yaml Secret from this overlay's
# rendered output. external-secret.yaml's ExternalSecret (creationPolicy:
# Owner) creates a Secret of the identical name in its place, synced from
# Vault -- if the base's static Secret weren't deleted here, kustomize
# would try to merge two same-named Secret resources and the checked-in
# placeholder values would win/conflict instead of the real ones.
apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: monkeybrain
$patch: delete
