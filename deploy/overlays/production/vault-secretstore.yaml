# Requires the External Secrets Operator CRDs + controller already
# installed in-cluster (not managed by this repo -- see ./README.md).
#
# Namespaced SecretStore, not a cluster-scoped ClusterSecretStore: this
# repo deploys into exactly one namespace (monkeybrain), so cluster-wide
# reuse isn't needed, and it keeps kustomize's namespace transformer
# above (kustomization.yaml's `namespace: monkeybrain`) unambiguous --
# ClusterSecretStore is cluster-scoped and would need excluding from
# that transform.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: monkeybrain
spec:
  provider:
    vault:
      # Placeholder -- point this at the real Vault address for the
      # cluster this overlay is applied to before deploying.
      server: "https://vault.internal.example.com:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # Vault-side role (`vault write auth/kubernetes/role/agentos-production ...`,
          # see ./README.md) that binds this ServiceAccount+namespace to
          # the read-only policy on the agentos-secrets KV path.
          role: agentos-production
          serviceAccountRef:
            name: external-secrets-vault-auth
            namespace: monkeybrain
