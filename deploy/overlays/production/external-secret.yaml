# Replaces the checked-in deploy/k8s/secret.yaml (deleted from this
# overlay by delete-checked-in-secret.yaml) with a k8s Secret of the
# SAME name and keys, kept in sync from Vault instead of git. Every
# Deployment's secretKeyRef (deployment.yaml, actor-deployment.yaml,
# auth-deployment.yaml, drone-actor-deployment.yaml, edge-actor-deployment.yaml)
# references `agentos-secrets` by name/key and needs ZERO changes -- this
# is what the ExternalSecret controller produces for them to keep
# reading.
#
# `extract` pulls every field at the one Vault KV v2 path below as a
# same-named Secret key -- write the exact 9 keys deploy/k8s/secret.yaml
# used to hand-carry (neo4j-password, neo4j-auth, internal-service-token,
# access-token-secret, refresh-token-secret, agentos-api-key,
# openrouter-api-key, moss-project-id, moss-project-key) into Vault at
# this path, e.g.:
#
#   vault kv put secret/monkeybrain/production/agentos-secrets \
#     neo4j-password=... neo4j-auth=... internal-service-token=... \
#     access-token-secret=... refresh-token-secret=... agentos-api-key=... \
#     openrouter-api-key=... moss-project-id=... moss-project-key=...
#
# See ./README.md for the full one-time setup.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentos-secrets
  namespace: monkeybrain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: agentos-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monkeybrain/production/agentos-secrets
