_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://127.0.0.1:3000
        - http://127.0.0.1:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Requested-With
        - X-Request-Id
        - X-Trace-Id
        - X-User-ID
        - Idempotency-Key
      exposed_headers:
        - X-Request-Id
        - X-Trace-Id
        - X-Kong-Request-Id
      credentials: true
      max_age: 3600
      preflight_continue: false
  - name: rate-limiting
    config:
      minute: 3000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

