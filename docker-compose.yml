      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NATS_URL=nats://nats:4222
      - INFLUXDB_URL=http://influxdb:8181
      - INFLUXDB_ORG=indus
      - INFLUXDB_BUCKET=events
      - AUDIT_ELASTICSEARCH_URL=http://elasticsearch:9200
      - OPA_URL=http://opa:8181
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
      opa:
        condition: service_started
    restart: unless-stopped

  # ── API Gateway (Kong) — single north-south HTTP boundary ───────────────
  # External clients, cogctl, and UIs should use http://localhost:8000.
  # Backend services remain cluster-internal; see kong/kong.yml for routes.
  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
      KONG_HEADERS: "off"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      agentos:
        condition: service_started
      auth:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  neo4j_data:
  influxdb_data:
  es_data:
  nats_data:
