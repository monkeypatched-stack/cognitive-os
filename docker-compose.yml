version: "3.8"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    # Gate 8 (Operations) finding: the comment this replaced ("neo4j
    # removed — replaced by TensorGraphStore") does not match reality —
    # confirmed live all session (SemanticGraph connects to
    # bolt://localhost:7687 on every boot; deploy/k8s/configmap.yaml
    # already configures NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD for exactly
    # this). Without this service, `docker-compose up` could never
    # actually boot the agentos service — confirmed by running the
    # rebuilt image standalone (no Neo4j reachable): "Required
    # subsystems (Persistence, Runtime, Broca) raise RuntimeError on
    # failure" (kernel.py's own documented contract) — it fails fast
    # rather than silently degrading, which is correct once this
    # service actually exists to connect to.
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: wget -q --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  influxdb:
    image: influxdb:3.0
    ports:
      - "8181:8181"
    volumes:
      - influxdb_data:/var/lib/influxdb3
    healthcheck:
      test: curl -f http://localhost:8181/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    # -m 8222 real fix: the healthcheck below probes the HTTP monitor
    # endpoint on 8222, but nothing enabled it — confirmed live, the
    # container logged "Listening for client connections on 0.0.0.0:4222"
    # only, no monitor endpoint, so the healthcheck failed 100% of the
    # time with "Connection refused" despite NATS itself being healthy.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: wget -qO- http://localhost:8222/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    # Host port 8182, not 8181: influxdb already claims host 8181 above —
    # binding both there fails `docker-compose up` with "port is already
    # allocated". Internal traffic (OPA_URL=http://opa:8181, k8s
    # configmap, docs) all addresses the container port via the opa
    # service name, not this host mapping, so remapping the host side
    # only doesn't affect anything that talks to OPA.
    ports:
      - "8182:8181"
    # Filesystem bundle (opa/policies/*.rego) loaded directly at startup — no
    # remote bundle service or extra container needed. OPA's `bundles:` polling
    # config requires an HTTP(S)/OCI service for the resource, so a purely
    # local directory of loose .rego files is served this way instead, via
    # the documented "filesystem bundle" (--bundle flag) mechanism.
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--bundle", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
    # No healthcheck: confirmed live — openpolicyagent/opa:latest is a
    # fully minimal image (no /bin/sh, no wget, nothing but the /opa
    # binary itself), so any exec-based healthcheck (this one included)
    # fails immediately with "stat /bin/sh: no such file or directory"
    # regardless of whether OPA itself is healthy. agentos's own
    # depends_on below uses `service_started`, not `service_healthy`,
    # for opa specifically because of this constraint.

  # ── Core Services ──────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: docker/services/auth/Dockerfile
    ports:
      - "8010:8010"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - INFLUXDB_URL=http://influxdb:8181
      - INFLUXDB_ORG=indus
      - INFLUXDB_BUCKET=events
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  events:
    build:
      context: .
      dockerfile: docker/services/events/Dockerfile
    ports:
      - "8013:8013"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=demo
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

