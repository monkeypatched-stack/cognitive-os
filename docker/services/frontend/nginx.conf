server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same backend the dev proxy (vite.config.ts) points at, but as the
    # in-cluster Kong Service name/port instead of a port-forwarded
    # localhost target.
    location /api/ {
        proxy_pass http://kong-proxy.monkeybrain.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # WebSocket upgrade support (src/api/useWebSocket.ts connects to
        # /api/v1/agentos/ws/status) — same as vite.config.ts's ws: true.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Root-level probes (src/monkey_brain/api/main.py) live outside the
    # /api/v1/agentos prefix — same three paths vite.config.ts proxies
    # directly.
    location = /live { proxy_pass http://kong-proxy.monkeybrain.svc.cluster.local:80; }
    location = /health { proxy_pass http://kong-proxy.monkeybrain.svc.cluster.local:80; }
    location = /ready { proxy_pass http://kong-proxy.monkeybrain.svc.cluster.local:80; }

    # SPA routing: react-router-dom's client-side routes (e.g. /login)
    # have no matching static file — always fall back to index.html and
    # let the client-side router decide, instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
